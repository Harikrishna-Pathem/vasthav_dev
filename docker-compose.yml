services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vasthav
      POSTGRES_PASSWORD: vasthav
      POSTGRES_DB: vasthav
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vasthav -d vasthav']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vasthav:vasthav@postgres:5432/vasthav?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
